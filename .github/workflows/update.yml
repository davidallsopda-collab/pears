name: Update pairs

on:
  schedule:
    # every 15 minutes on weekdays, plus once after the close (GitHub often skips some)
    - cron: "*/15 13-21 * * 1-5"
    - cron: "40 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install libraries
        run: pip install yfinance pandas
      - name: Run Pears
        run: python pears.py
      - name: Save results
        run: |
          git config user.name "pears-bot"
          git config user.email "pears-bot@users.noreply.github.com"
          git add docs/summary.json docs/data
          git diff --cached --quiet || (git commit -m "Update pairs" && git pull --rebase && git push)
